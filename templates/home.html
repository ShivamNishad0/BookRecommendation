<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="home-container fade-in" onclick="searchBooks()">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Studying Student" class="logo">
        <h1>Welcome to Our Book World!</h1>
        <h2>
            Discover Amazing <span class="bounce">Books</span>!
        </h2>
        <div class="hover-message">Click on me to go!</div>
    </div>

    <script>
        function searchBooks(){
            window.location.href = "/login";
        }
        
        document.addEventListener("mousemove", (e) => {
        const cursor = document.createElement("div");
        cursor.classList.add("cursor");
        document.body.appendChild(cursor);
        
        cursor.style.left = e.pageX + 'px';
        cursor.style.top = e.pageY + 'px';

        // Add ripple effect class
        setTimeout(() => {
            cursor.classList.add("ripple");
        }, 10);

        // Remove ripple effect after animation
        setTimeout(() => {
            cursor.classList.remove("ripple");
        }, 500);

        // Remove previous cursor element
        setTimeout(() => {
            cursor.remove();
        }, 100);
    });

    </script>
</body>
</html>
